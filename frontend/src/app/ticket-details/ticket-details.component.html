<app-sidebar [currentPage]="page"></app-sidebar>
<app-navbar></app-navbar>
<app-breadcrumb [listPages]="allPages" [titlePage]="title"></app-breadcrumb>
<div class="float-start container">
  <div class="mt-2">
    <h1>{{title}}</h1>
  </div>
  <div class="mt-3">
    <div class="align-items-center p-3 my-3 bg-white rounded shadow-sm">

      <div class="row">
        <div class="col-2">
          <p>Nombre</p>
        </div>
        <div class="col-3">
          <p>Fecha</p>
        </div>
        <div class="col-7">
          <p>Contenido</p>
        </div>
      </div>
      <hr class="mt-0">
      <div class="row">
        <div class="col-2">
          <p>{{author}}</p>
        </div>
        <div class="col-3">
          <p>{{createdAt}}</p>
        </div>
        <div class="col-7">
          <p>{{description}}</p>
        </div>
      </div>

      <div *ngFor="let i of answers" class="row">
        <div class="col-2">
          <p>{{i['user']['firstName']}} {{i['user']['lastName']}}</p>
        </div>
        <div class="col-3">
          <p>{{i['date']}}</p>
        </div>
        <div class="col-7">
          <p>{{i['answer']}}</p>
        </div>
      </div>
    </div>
    
    <div class="align-items-center p-3 my-3 bg-white rounded shadow-sm">
      <form class="row" #f="ngForm" (ngSubmit)='ngOnSubmit()' novalidate>
        <div class="col-2">

        </div>
        <div class="col-3">

        </div>
        <div class="col-7">
          <div class="mb-3">
            <label for="formGroupExampleInput" class="form-label">Responder</label>
            <div class="form-floating">
              <textarea class="form-control shadow-none" placeholder="" id="floatingTextarea" name="ticketAnswer" style="height:200px;"
              [(ngModel)]="answer"></textarea>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-primary">Enviar</button>
          </div>
        </div>
      </form>

  </div>
</div>
