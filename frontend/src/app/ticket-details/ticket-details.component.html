<app-sidebar [currentPage]="page"></app-sidebar>
<app-navbar></app-navbar>
<app-breadcrumb [listPages]="allPages" [titlePage]="title"></app-breadcrumb>
<div class="float-start container">
  <div class="mt-2">
    <h1>{{title}}</h1>
  </div>

  <div *ngIf="role == 'admin' || role == 'superadmin'" class="d-flex justify-content-end p-3 my-3 text-white bg-white rounded shadow-sm">
    <div *ngIf="status != 3; then thenStatusSolvedBlock else elseStatusSolvedBlock"></div>
    <ng-template #thenStatusSolvedBlock>
      <button type="button" class="btn btn-success" (click)="ngOnTicketSolved()">Resolver solicitud</button>
    </ng-template>
    <ng-template #elseStatusSolvedBlock>
      <button type="button" class="btn btn-success" disabled>Resolver solicitud</button>
    </ng-template>

    <div *ngIf="status != 2; then thenStatusClosedBlock else elseStatusClosedBlock"></div>
    <ng-template #thenStatusClosedBlock>
      <button type="button" class="btn btn-danger ms-2" (click)="ngOnTicketClosed()">Cerrar solicitud</button>
    </ng-template>
    <ng-template #elseStatusClosedBlock>
      <button type="button" class="btn btn-danger ms-2" disabled>Cerrar solicitud</button>
    </ng-template>

    <div *ngIf="status != 1; then thenStatusOpenBlock else elseStatusOpenBlock"></div>
    <ng-template #thenStatusOpenBlock>
      <button type="button" class="btn btn-primary ms-2" (click)="ngOnTicketOpen()">Abrir solicitud</button>
    </ng-template>
    <ng-template #elseStatusOpenBlock>
      <button type="button" class="btn btn-primary ms-2" disabled>Abrir solicitud</button>
    </ng-template>

    <button *ngIf="role == 'superadmin'" type="button" class="btn btn-danger ms-5" (click)="ngOnTicketDelete()">Eliminar solicitud</button>
  </div>


  <div class="mt-3">
    <div class="align-items-center p-3 my-3 bg-white rounded shadow-sm">
      <div class="row">
        <div class="col-2">
          <p>Nombre</p>
        </div>
        <div class="col-3">
          <p>Fecha</p>
        </div>
        <div class="col-7">
          <p>Contenido</p>
        </div>
      </div>
      <hr class="mt-0">
      <div class="row">
        <div class="col-2">
          <p>{{author}}</p>
        </div>
        <div class="col-3">
          <p>{{createdAt}}</p>
        </div>
        <div class="col-7">
          <p>{{description}}</p>
        </div>
      </div>

      <div *ngFor="let i of answers" class="row">
        <div class="col-2">
          <p>{{i['user']['firstName']}} {{i['user']['lastName']}}</p>
        </div>
        <div class="col-3">
          <p>{{i['date']}}</p>
        </div>
        <div class="col-7">
          <p>{{i['answer']}}</p>
        </div>
      </div>
    </div>
    
    <div *ngIf="status == 1 && role != 'superadmin'" class="align-items-center p-3 my-3 bg-white rounded shadow-sm">
      <form class="row" #f="ngForm" (ngSubmit)='ngOnSubmit()' novalidate>
        <div class="col-2">

        </div>
        <div class="col-3">

        </div>
        <div class="col-7">
          <div class="mb-3">
            <label for="formGroupExampleInput" class="form-label">Responder</label>
            <div class="form-floating">
              <textarea class="form-control shadow-none" placeholder="" id="floatingTextarea" name="ticketAnswer" style="height:200px;"
              [(ngModel)]="answer"></textarea>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-primary">Enviar</button>
          </div>
        </div>
      </form>

  </div>
</div>
