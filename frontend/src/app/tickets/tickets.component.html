<app-sidebar [currentPage]="page"></app-sidebar>
<app-navbar></app-navbar>
<app-breadcrumb [listPages]="allPages" [titlePage]="title"></app-breadcrumb>
<div class="float-start container">
  <div class="mt-2">
    <h1>{{title}}</h1>
  </div>
  <div class="mt-3">
    <div class="align-items-center p-3 my-3 text-white bg-white rounded shadow-sm">

      <div class="card mt-3 mb-3">
        <div class="card-header">
          <p>Solicitudes</p>
        </div>
        <div class="card-body p-0">
          <ul class="list-group rounded-0">
            <div class="m-2 mb-0 row">
              <div class="col-1">
                <p>ID</p>
              </div>
              <div class="col-4">
                <p>Título</p>
              </div>
              <div class="col-4">
                <p>Fecha de creación</p>
              </div>
              <div class="col-1 text-center">
                <p>Estado</p>
              </div>
              <div class="col-2 text-center">
                <p>Opciones</p>
              </div>
            </div>
            <hr class="mb-2 mt-2">

            <div *ngFor="let i of tickets | keyvalue" class="m-2 row">
              <div class="col-1">
                <p>{{i.value['id']}}</p>
              </div>
              <div class="col-4">
                <p>{{i.value['title']}}</p>
              </div>
              <div class="col-4">
                <p>{{i.value['date']}}</p>
              </div>
              <div *ngIf="i.value['status'].status == 'open'" class="col-1 text-center">
                <p>Abierto</p>
              </div>
              <div class="col-2 text-center">
                <button type="button" class="btn btn-primary btn-sm" (click)="ngOnTicketDetails(i)">
                  <p>Ver detalles</p>
                </button>
              </div>
            </div>
            
          </ul>
          
          
        </div>
      </div>
      
      <nav aria-label="..." class="d-flex flex-row-reverse">
        <ul class="pagination">
          <li class="page-item disabled">
            <span class="page-link">Anterior</span>
          </li>
          <li class="page-item active"><span class="page-link">1</span></li>
          <li class="page-item" aria-current="page"><a class="page-link" href="#">2</a></li>
          <li class="page-item"><a class="page-link" href="#">3</a></li>
          <li class="page-item"><a class="page-link" href="#">Siguiente</a></li>
        </ul>
      </nav>

  </div>
</div>
